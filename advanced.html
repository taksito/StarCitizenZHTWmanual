<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階說明 - Star Citizen 繁體中文新手入門教學</title>
    <meta name="description" content="Star Citizen 進階說明，包含保險配置與飛機組件介紹。">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main>
        <section class="hero glass-panel">
            <h1><span class="text-gradient">進階說明</span></h1>
            <p>這裡收錄了較進階的遊戲機制說明，包含如何正確配置飛機組件與保險設定。</p>
        </section>

        <div class="card-grid">
            <!-- 保險配置 -->
            <div class="nav-card glass-panel" style="text-align: left;">
                <h3 class="text-gradient">🛡️ 保險配置</h3>
                <p><strong>適用版本：</strong> 4.8+</p>
                <p style="margin-top: 10px;">說明如何在遊戲中更改飛機組件配置，並透過 ASOP Terminal 完成保險登記，讓飛機每次呼叫都保留自訂組件。</p>
                <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                    <a href="insurance.html" class="btn" style="font-size: 0.8rem; padding: 8px 16px;">查看說明</a>
                </div>
            </div>

            <!-- 飛機組件 -->
            <div class="nav-card glass-panel" style="text-align: left;">
                <h3 class="text-gradient">⚙️ 飛機組件</h3>
                <p><strong>分類：</strong> 武器 / 護盾 / 推進器 / 電源</p>
                <p style="margin-top: 10px;">整理常見飛機組件的分類與規格說明，幫助玩家了解各組件的差異與選擇方向。</p>
                <div style="margin-top: 15px; border-top: 1px solid var(--glass-border); padding-top: 15px;">
                    <a href="ship-components.html" class="btn" style="font-size: 0.8rem; padding: 8px 16px;">查看組件列表</a>
                </div>
            </div>
        </div>

        <div style="margin-top: 40px; text-align: center;">
            <a href="index.html" class="btn">返回首頁</a>
        </div>
    </main>

    <script src="components.js"></script>
</body>
</html>
